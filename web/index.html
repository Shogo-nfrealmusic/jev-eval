<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jev vs LLMs</title>
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #141416;
    --line: #26262a;
    --text: #f4f4f5;
    --muted: #8b8b93;
    --accent: #3987e5;
    --ok: #3fb950;
    --ng: #f0524f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1280px; height: 720px; overflow: hidden; position: relative;
    color: var(--text); font: 14px/1.4 Inter, "Helvetica Neue", "Hiragino Sans", "PingFang SC", "Apple SD Gothic Neo", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  header { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 0; height: 72px; }
  h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  h1 .vs { color: var(--muted); font-weight: 400; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .meta { text-align: right; color: var(--muted); font-size: 12px; }
  .meta .live { color: var(--accent); font-weight: 600; }

  main { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; padding: 0 24px; height: 628px; }
  .lane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lane-head { display: flex; justify-content: space-between; align-items: baseline; }
  .lane-name { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  .lane.jev .lane-name { color: var(--accent); }
  .lane-model, .lane-progress { color: var(--muted); font-size: 12px; }

  .now { height: 56px; display: flex; gap: 8px; align-items: flex-start; }
  .lang { flex: none; font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-top: 2px; text-transform: uppercase; }
  .now-text { flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; }
  .spinner { flex: none; width: 16px; height: 16px; margin-top: 3px; border: 2px solid var(--line); border-top-color: var(--text); border-radius: 50%; animation: spin 0.8s linear infinite; visibility: hidden; }
  .lane.busy .spinner { visibility: visible; }
  .lane.jev .spinner { border-top-color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .last { height: 132px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; transition: border-color 150ms; }
  .last.ok { border-color: var(--ok); }
  .last.ng { border-color: var(--ng); }
  .chip { justify-self: start; align-self: start; font-size: 13px; font-weight: 600; background: #232327; border-radius: 999px; padding: 2px 10px; }
  .last .ms { font-size: 13px; color: var(--muted); }
  .bars { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }
  .bar { display: grid; grid-template-columns: 86px 1fr 36px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .bar-track { height: 6px; background: #232327; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--text); border-radius: 3px; }
  .lane.jev .bar-fill { background: var(--accent); }
  .bar .p { text-align: right; }
  .noprob { grid-column: 1 / -1; color: var(--muted); font-size: 12px; align-self: center; }
  .expected { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

  .hist { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 24px; gap: 4px 6px; align-content: start; }
  .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px; align-items: center; font-size: 11.5px; border-left: 3px solid var(--line); padding-left: 6px; background: #18181b; border-radius: 0 4px 4px 0; min-width: 0; }
  .row > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.ok { border-left-color: var(--ok); }
  .row.ng { border-left-color: var(--ng); }
  .row .id { color: var(--muted); }
  .row .ms { color: var(--muted); padding-right: 6px; }

  .totals { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); padding-top: 10px; }
  .totals .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .totals .v { font-size: 17px; font-weight: 600; }

  #final { position: absolute; left: 24px; right: 24px; bottom: 14px; height: 340px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(11, 11, 12, 0.6); padding: 22px 28px; opacity: 0; transform: translateY(12px); transition: opacity 400ms, transform 400ms; pointer-events: none; display: grid; grid-template-columns: 1.25fr 1px 1fr; gap: 28px; }
  #final.show { opacity: 1; transform: none; }
  .sep { background: var(--line); }
  table.res { width: 100%; border-collapse: collapse; }
  table.res th { color: var(--muted); font-size: 12px; font-weight: 400; text-align: right; padding: 0 0 10px; }
  table.res th:first-child { text-align: left; }
  table.res td { text-align: right; padding: 8px 0; font-size: 22px; border-top: 1px solid var(--line); }
  table.res td:first-child { text-align: left; font-size: 14px; color: var(--muted); }
  table.res tr.jev td { font-size: 30px; font-weight: 700; color: var(--accent); }
  table.res tr.jev td:first-child { font-size: 15px; color: var(--accent); }
  .mult .k { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .mult .line { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .mult .x { font-size: 44px; font-weight: 700; line-height: 1; min-width: 118px; text-align: right; }
  .mult .x small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .mult .vs { color: var(--muted); font-size: 13px; }
  .mult .group + .group { margin-top: 8px; }
  .final-src { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; align-self: end; }

  #idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; pointer-events: none; }
  #idle.hide { display: none; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Jev <span class="vs">vs</span> LLMs — routing 60 customer messages</h1>
    <div class="sub" id="sub">Demo shows 12 of the 60 cases (6 easy, 6 hard, fixed before results were seen)</div>
  </div>
  <div class="meta" id="meta">&nbsp;</div>
</header>

<main id="lanes"></main>

<div id="final"></div>
<div id="idle">Click or press Space to start</div>

<template id="lane-tpl">
  <div class="lane-head"><span class="lane-name"></span><span class="lane-progress">0 / 12</span></div>
  <div class="lane-model"></div>
  <div class="now"><span class="lang">&nbsp;</span><div class="now-text"></div><div class="spinner"></div></div>
  <div class="last"><div class="noprob">Waiting…</div></div>
  <div class="hist"></div>
  <div class="totals">
    <div><div class="k">Correct</div><div class="v t-correct">0 / 0</div></div>
    <div><div class="k">Avg latency</div><div class="v t-lat">–</div></div>
    <div><div class="k">Cost so far</div><div class="v t-cost">–</div></div>
  </div>
</template>

<script>
  const $ = (sel, root = document) => root.querySelector(sel);
  const fmtMs = (ms) => `${Math.round(ms).toLocaleString("en-US")} ms`;
  const fmtUsd = (v, digits = 6) => (v == null ? "–" : `$${v.toFixed(digits)}`);
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

  const lanes = {};
  let total = 12;

  function onMeta(m) {
    total = m.total;
    const mode = m.live ? `<span class="live">LIVE</span> · calling the APIs now (not the measured run)` : `Replay of measured runs · n=${m.nAll} · ${m.date}`;
    $("#meta").innerHTML = `${mode}<br>${m.live ? "" : `timings = measured latencies of round ${m.round}`}`;
    $("#title").innerHTML = `${m.lanes.map((l) => esc(l.key === "jev" ? "Jev" : l.name)).join(' <span class="vs">vs</span> ')} — routing 60 customer messages`;
    for (const l of m.lanes) {
      const el = document.createElement("section");
      el.className = `lane ${l.key}`;
      el.append($("#lane-tpl").content.cloneNode(true));
      $(".lane-name", el).textContent = l.name;
      $(".lane-model", el).textContent = l.model;
      $(".lane-progress", el).textContent = `0 / ${total}`;
      $("#lanes").append(el);
      lanes[l.key] = { el, done: 0, correct: 0, latSum: 0, cost: 0, costKnown: true };
    }
  }

  function onStart(e) {
    const l = lanes[e.lane];
    l.el.classList.add("busy");
    $(".now .lang", l.el).textContent = e.case.lang;
    $(".now-text", l.el).textContent = e.case.text;
  }

  function onResult(e) {
    const l = lanes[e.lane];
    l.el.classList.remove("busy");
    l.done++;
    if (e.correct) l.correct++;
    l.latSum += e.latencyMs;
    if (typeof e.costUsd === "number") l.cost += e.costUsd; else l.costKnown = false;
    const cls = e.correct ? "ok" : "ng";

    const last = $(".last", l.el);
    last.className = `last ${cls}`;
    const label = e.ok ? e.category : "error";
    let body = `<span class="chip">${esc(label)}</span><span class="ms">${fmtMs(e.latencyMs)}</span>`;
    if (e.categoryProbs) {
      const top = Object.entries(e.categoryProbs).sort((a, b) => b[1] - a[1]).slice(0, 3);
      body += `<div class="bars">${top.map(([k, p]) => `<div class="bar"><span>${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${(p * 100).toFixed(1)}%"></div></div><span class="p">${p.toFixed(2)}</span></div>`).join("")}</div>`;
    } else {
      body += `<div class="noprob">${e.ok ? "No probabilities returned (structured output)" : esc(e.error ?? "")}</div>`;
    }
    body += `<div class="expected">expected: ${esc(e.expected)}</div>`;
    last.innerHTML = body;

    $(".hist", l.el).insertAdjacentHTML("beforeend",
      `<div class="row ${cls}"><span class="id">${String(e.i + 1).padStart(2, "0")}</span><span>${esc(label)}</span><span class="ms">${fmtMs(e.latencyMs)}</span></div>`);

    $(".lane-progress", l.el).textContent = `${l.done} / ${total}`;
    $(".t-correct", l.el).textContent = `${l.correct} / ${l.done}`;
    $(".t-lat", l.el).textContent = fmtMs(l.latSum / l.done);
    $(".t-cost", l.el).textContent = l.costKnown ? fmtUsd(l.cost) : "n/a";
  }

  function onLaneDone(e) {
    const l = lanes[e.lane];
    $(".now .lang", l.el).textContent = "✓";
    $(".now-text", l.el).textContent = `Done — ${total} messages in ${(l.latSum / 1000).toFixed(1)} s`;
  }

  function ratio(a, b) {
    // a / b. Returns value and direction so values below 1 can be shown as "slower / more expensive"
    if (!a || !b) return null;
    return a >= b ? { x: a / b, better: true } : { x: b / a, better: false };
  }
  const fmtX = (r) => (r.x >= 10 ? r.x.toFixed(0) : r.x.toFixed(1));
  const usd = (v) => (v == null ? "n/a" : v < 1 ? `$${v.toFixed(3)}` : `$${v.toFixed(2)}`);

  function multLine(r, good, bad) {
    return r ? `<span class="x">${fmtX(r)}×<small>${r.better ? good : bad}</small></span>` : `<span class="x">n/a</span>`;
  }

  function onFinal(f) {
    const table = `
      <table class="res">
        <tr><th></th><th>Category accuracy</th><th>Latency p50</th><th>Cost / 1,000</th></tr>
        ${f.rows.map((r) => `<tr class="${r.jev ? "jev" : ""}"><td>${esc(r.name)}</td><td>${r.accuracy}%</td><td>${r.p50.toLocaleString("en-US")} ms</td><td>${usd(r.per1000)}</td></tr>`).join("")}
      </table>`;
    // Each multiplier is Jev vs that model within the same run
    const mult = (key, good, bad, label) => `
      <div class="group"><div class="k">${label}</div>
        ${f.ratios.map((r) => `<div class="line">${multLine(ratio(r.other[key], r.jev[key]), good, bad)}<span class="vs">vs ${esc(r.vs)}</span></div>`).join("")}
      </div>`;
    $("#final").innerHTML = `
      <div>${table}</div>
      <div class="sep"></div>
      <div class="mult">${mult("p50", "faster", "slower", "Jev speed (p50)")}${mult("per1000", "cheaper", "more expensive", "Jev cost")}</div>
      <div class="final-src">${esc(f.source)} · accuracy = exact category match over all rounds · cost = AI Gateway billed cost · multipliers use Jev from the same run as each model</div>`;
    $("#final").classList.add("show");
  }

  let started = false;
  function start() {
    if (started) return;
    started = true;
    $("#idle").classList.add("hide");
    const es = new EventSource("/events");
    es.onmessage = (msg) => {
      const e = JSON.parse(msg.data);
      ({ meta: onMeta, start: onStart, result: onResult, laneDone: onLaneDone, final: (f) => { onFinal(f); es.close(); } })[e.type]?.(e);
    };
  }
  addEventListener("click", start);
  addEventListener("keydown", (e) => { if (e.code === "Space") start(); });
  // For recording: /?autostart starts automatically 1s after load
  if (new URLSearchParams(location.search).has("autostart")) setTimeout(start, 1000);
</script>
</body>
</html>
